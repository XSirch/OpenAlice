name: Coolify Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy master to Coolify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Coolify deployment configuration
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error title=Coolify deploy is not configured::Add COOLIFY_WEBHOOK and COOLIFY_TOKEN as repository or production-environment secrets."
            exit 1
          fi
          case "$COOLIFY_WEBHOOK" in
            https://*) ;;
            *)
              echo "::error title=Invalid Coolify webhook::COOLIFY_WEBHOOK must use HTTPS."
              exit 1
              ;;
          esac

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --request GET \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
